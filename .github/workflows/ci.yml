name: Secure Auth CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Compose JWT configuration
        run: python scripts/check_compose_security.py

      - name: Verify Alembic migrations
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/auth_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-min-32-chars
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REFRESH_TOKEN_EXPIRE_DAYS: 7
        run: |
          # Fresh database bootstrap.
          python scripts/prepare_database.py
          python -m alembic check

          # Normal tracked database is idempotent.
          python scripts/prepare_database.py

          # Verify migration reversibility.
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check

          # Simulate each legitimate historical untracked database.
          for revision in 2b7c4e1a9d03 5e3526e9e493 c4f2e8a91b7d head; do
            python -m alembic downgrade base
            python -m alembic upgrade "$revision"

            python - <<'PYCODE'
          from sqlalchemy import text
          from app.db.session import engine

          with engine.begin() as connection:
              connection.execute(
                  text("DROP TABLE IF EXISTS alembic_version")
              )
          PYCODE

            python scripts/prepare_database.py
            python -m alembic current
            python -m alembic check
          done

          # Duplicate legacy token hashes must block the unique-index migration.
          python -m alembic downgrade c4f2e8a91b7d

          python - <<'PYCODE'
          import uuid
          from datetime import UTC, datetime, timedelta

          from sqlalchemy import text

          from app.db.session import engine

          user_id = uuid.uuid4()
          first_token_id = uuid.uuid4()
          second_token_id = uuid.uuid4()
          now = datetime.now(UTC).replace(tzinfo=None)
          expires_at = now + timedelta(days=1)

          with engine.begin() as connection:
              connection.execute(
                  text(
                      """
                      INSERT INTO users
                          (
                              id,
                              email,
                              password_hash,
                              is_active,
                              created_at,
                              token_version
                          )
                      VALUES
                          (
                              :id,
                              :email,
                              :password_hash,
                              true,
                              :created_at,
                              1
                          )
                      """
                  ),
                  {
                      "id": user_id,
                      "email": "migration-duplicate@example.com",
                      "password_hash": "test-hash",
                      "created_at": now,
                  },
              )

              for token_id in (first_token_id, second_token_id):
                  connection.execute(
                      text(
                          """
                          INSERT INTO refresh_tokens
                              (
                                  id,
                                  user_id,
                                  family_id,
                                  replaced_by_token_id,
                                  token_hash,
                                  expires_at,
                                  revoked,
                                  created_at
                              )
                          VALUES
                              (
                                  :id,
                                  :user_id,
                                  :family_id,
                                  NULL,
                                  :token_hash,
                                  :expires_at,
                                  false,
                                  :created_at
                              )
                          """
                      ),
                      {
                          "id": token_id,
                          "user_id": user_id,
                          "family_id": token_id,
                          "token_hash": "duplicate-migration-test-hash",
                          "expires_at": expires_at,
                          "created_at": now,
                      },
                  )
          PYCODE

          if python -m alembic upgrade head; then
            echo "FAIL: duplicate refresh-token hashes were accepted"
            exit 1
          fi

          echo "PASS: duplicate refresh-token hashes rejected"

          python - <<'PYCODE'
          from sqlalchemy import text

          from app.db.session import engine

          with engine.begin() as connection:
              connection.execute(
                  text(
                      """
                      DELETE FROM refresh_tokens
                      WHERE token_hash = 'duplicate-migration-test-hash'
                      """
                  )
              )
              connection.execute(
                  text(
                      """
                      DELETE FROM users
                      WHERE email = 'migration-duplicate@example.com'
                      """
                  )
              )
          PYCODE

          python -m alembic upgrade head
          python -m alembic check

          # Unknown schema drift must fail closed.
          python -m alembic downgrade 5e3526e9e493

          python - <<'PYCODE'
          from sqlalchemy import text
          from app.db.session import engine

          with engine.begin() as connection:
              connection.execute(
                  text("DROP TABLE IF EXISTS alembic_version")
              )
              connection.execute(
                  text("ALTER TABLE users DROP COLUMN email")
              )
          PYCODE

          if python scripts/prepare_database.py; then
            echo "FAIL: unknown database drift was accepted"
            exit 1
          fi

          echo "PASS: unknown database drift rejected"

          # Restore a clean migrated database for pytest.
          python - <<'PYCODE'
          from sqlalchemy import text
          from app.db import models  # noqa: F401
          from app.db.session import Base, engine

          Base.metadata.drop_all(bind=engine)

          with engine.begin() as connection:
              connection.execute(
                  text("DROP TABLE IF EXISTS alembic_version")
              )
          PYCODE

          python scripts/prepare_database.py
          python -m alembic check

      - name: Run tests
        env:
          TESTING: "1"
          USE_DOCKER_DB: "1"
          ENVIRONMENT: test
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/auth_db
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci-pipeline-min-32-chars
          JWT_ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 30
          REFRESH_TOKEN_EXPIRE_DAYS: 7
        run: |
          pytest -v --tb=short

  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run production Compose E2E security gate
        run: bash scripts/test_compose_e2e.sh
