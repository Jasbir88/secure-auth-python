version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "fastapi"
        versions:
          - ">=0.137.0"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:10"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: Asia/Kuala_Lumpur
    open-pull-requests-limit: 5
