services:
  db:
    restart: unless-stopped
    stop_grace_period: 30s

  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_data:/data
    restart: unless-stopped
    stop_grace_period: 15s

  migrate:
    restart: "no"

  app:
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      - EMAIL_VERIFICATION_EXPIRE_HOURS=${EMAIL_VERIFICATION_EXPIRE_HOURS:-24}
      - PASSWORD_RESET_EXPIRE_MINUTES=${PASSWORD_RESET_EXPIRE_MINUTES:-30}
      - SMTP_HOST=${SMTP_HOST:?SMTP_HOST must be set}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:?SMTP_USERNAME must be set}
      - SMTP_PASSWORD=${SMTP_PASSWORD:?SMTP_PASSWORD must be set}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:?SMTP_FROM_EMAIL must be set}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-true}
      - SMTP_TIMEOUT_SECONDS=${SMTP_TIMEOUT_SECONDS:-10}

volumes:
  redis_data:
